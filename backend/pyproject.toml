[project]
name = "alphaseek-backend"
version = "0.1.0"
description = "AlphaSeek — autonomous AI quant researcher (backend: FastAPI + research loop)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "sse-starlette>=2.1",       # server-sent events (stream the agent live)
    "openai>=1.40",             # OpenAI-compatible client — works with GLM (z.ai), Claude, OpenAI
    "python-dotenv>=1.0",
    "qdrant-client>=1.11",      # vector store (hybrid search)
    "fastembed>=0.4",           # ONNX embeddings (BAAI/bge-small-en-v1.5)
    "requests>=2.31",           # paper fetching (Jina, arXiv, Semantic Scholar)
    "psycopg[binary]>=3.1",    # Postgres driver
    "redis>=5.0",               # queue broker + live pub/sub
    "arq>=0.26",              # async task queue
    "kafka-python>=2.0",      # Redpanda/Kafka client (pure Python, no C deps)
    "boto3>=1.34",              # S3 artifact storage
    "exa-py>=1.5",             # neural web search (SSRN, blogs, repos)
]

[project.optional-dependencies]
llm = ["sentence-transformers>=3.0"]   # cross-encoder reranking (optional, degrades gracefully)
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
