# AlphaSeek v3 infrastructure — the backing services the scaled architecture runs on.
# Additive: the existing single-process app keeps working; v3 components attach to these.
#   docker compose up -d        # start all
#   docker compose ps           # status
services:
  # Job queue broker + live pub/sub + cache (arq queue, event fan-out, paper cache).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Durable store: users / sessions / events (JSONB) — replaces SQLite for concurrency.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alphaseek
      POSTGRES_PASSWORD: alphaseek
      POSTGRES_DB: alphaseek
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaseek"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Persistent vector store for the cross-session paper/RAG corpus (fastembed vectors).
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  # Kafka-compatible event streaming (log-based persistence, replay, consumer groups).
  # Drop-in for Redis pub/sub — same API as Kafka, single binary, no JVM.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr=PLAINTEXT://localhost:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=localhost:33145
    ports:
      - "9092:9092"   # Kafka API
      - "8082:8082"   # HTTP proxy
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LLM gateway: one OpenAI-compatible endpoint with routing/failover/cost tracking.
  # Point the app at it via LLM_BASE_URL=http://localhost:4000.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    volumes: ["./litellm-config.yaml:/app/config.yaml:ro"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

volumes:
  redis-data:
  pg-data:
  qdrant-data:
  redpanda-data:
